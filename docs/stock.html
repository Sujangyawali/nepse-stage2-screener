<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Detail — NEPSE Stage 2 Screener</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container">
    <p><a href="index.html" id="backLink">&larr; Back</a></p>
    <h1 id="stockTitle">Loading…</h1>
    <div id="warningBanner"></div>
    <div class="chart-card" id="chartCard">
      <div class="chart-legend" id="chartLegend"></div>
      <div class="chart-wrap" id="priceChart"></div>
      <div class="chart-foot">
        <span>Daily candles · AMA = NepseAlpha "Moving Average Adaptive" · scroll to zoom, drag to pan</span>
        <button type="button" class="chart-btn" id="chartReset">Reset view</button>
      </div>
    </div>
    <p class="status" id="chartMissing" hidden>
      No chart for this stock — charts are published for the top 20 stocks by score and all Stage 2 candidates.
    </p>
    <h2>Trend Template scorecard</h2>
    <table id="scorecardTable">
      <tbody id="scorecardBody"></tbody>
    </table>
    <p class="status"><a href="DATA_LIMITATIONS.md">Data limitations &amp; methodology notes</a></p>
  </main>
  <script src="assets/js/vendor/lightweight-charts.standalone.production.js"></script>
  <script src="assets/js/stock.js"></script>
</body>
</html>
